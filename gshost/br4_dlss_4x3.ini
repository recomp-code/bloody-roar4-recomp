; Bloody Roar 4 (4:3) - preset DLSS: 2x interno (1280x1024 en PAL) reescalado por NVIDIA DLSS a la ventana/pantalla (FSR 1 si no hay DLSS). Menu F1.
; Windows / Vulkan. NbaUpscaler: 0 = no, 1 = AMD FSR 1, 2 = NVIDIA DLSS (FSR si DLSS no esta disponible); solo actua cuando
; la resolucion interna es menor que la ventana.
[EmuCore/GS]
Renderer = 14
upscale_multiplier = 2
MaxAnisotropy = 16
filter = 2
fxaa = true
CASMode = 1
CASSharpness = 50
NbaUpscaler = 2
NbaUpscalerSharpness = 35
ScreenshotSize = 0
AspectRatio = 4:3
OsdShowFPS = false
VsyncEnable = 1
pcrtc_antiblur = false
pcrtc_offsets = false
LoadTextureReplacements = true
DumpReplaceableTextures = false

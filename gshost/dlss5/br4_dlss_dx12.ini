; Bloody Roar 4 - DLSS 5: Direct3D 12 + ReShade + addon RenoDX DLSS5. 2x interno reescalado por NVIDIA DLSS y el pase neural
; (DLSS Neural Rendering) encima. En el juego: F6 = pase neural si/no, Inicio = menu de ReShade/addon, F1 = opciones del GS.
; DLSS (y por tanto el pase neural) solo actua cuando la resolucion interna es menor que la ventana/pantalla.
[EmuCore/GS]
Renderer = 15
upscale_multiplier = 2
MaxAnisotropy = 16
filter = 2
fxaa = true
CASMode = 1
CASSharpness = 50
NbaUpscaler = 2
NbaUpscalerSharpness = 35
ScreenshotSize = 0
AspectRatio = 16:9
OsdShowFPS = false
VsyncEnable = 1
pcrtc_antiblur = false
pcrtc_offsets = false
LoadTextureReplacements = true
DumpReplaceableTextures = false

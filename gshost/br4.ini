; Bloody Roar 4 (16:9 con parche panoramico, por defecto) Analog Mod (SLES-51877): opciones del GS de PCSX2 (menu F1). Se reescribe al cambiar.
; Windows / Vulkan. 6x = 3840x2688 interno (supermuestreo en 1440p). NbaUpscaler: 0 = no, 1 = AMD FSR 1, 2 = NVIDIA DLSS
; (FSR si DLSS no esta disponible); solo actua cuando la resolucion interna es menor que la ventana (p. ej. 2x/3x en 1440p o 4K).
[EmuCore/GS]
Renderer = 14
upscale_multiplier = 6
MaxAnisotropy = 16
filter = 2
fxaa = true
CASMode = 1
CASSharpness = 50
NbaUpscaler = 2
NbaUpscalerSharpness = 35
ScreenshotSize = 0
AspectRatio = 16:9
OsdShowFPS = false
VsyncEnable = 1
pcrtc_antiblur = false
pcrtc_offsets = false
LoadTextureReplacements = true
DumpReplaceableTextures = false
